<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Japan Travel Map</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#e8f4f7;font-family:'Hiragino Sans','Noto Sans CJK SC',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:15px 10px 40px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}

#tip-text{font-size:15px;color:#2a7a8a;font-weight:700;text-align:center;width:100%;max-width:500px;margin-bottom:6px;}
#header-bar{width:100%;max-width:500px;display:flex;justify-content:flex-end;align-items:center;margin-bottom:8px;padding:0 4px;will-change:transform;}
#lang-select{border:1px solid #9dd;border-radius:6px;padding:4px 6px;font-size:12px;background:#fff;color:#447;cursor:pointer;outline:none;}

.map-card{background:#fff;border-radius:16px;border:2px solid #fff;box-shadow:0 0 0 2px #fff;padding:16px;width:100%;max-width:500px;will-change:transform;contain:paint;}
svg.geolonia-svg-map{width:100%;height:auto;display:block;shape-rendering:optimizeSpeed;}

[data-region="hokkaido"] .prefecture{fill:#4eb8cc!important;stroke:#4eb8cc!important;stroke-width:1!important;}
[data-region="tohoku"]   .prefecture{fill:#5ac4c0!important;stroke:#5ac4c0!important;stroke-width:1!important;}
[data-region="kanto"]    .prefecture{fill:#3aafc4!important;stroke:#3aafc4!important;stroke-width:1!important;}
[data-region="chubu"]    .prefecture{fill:#4dc4bc!important;stroke:#4dc4bc!important;stroke-width:1!important;}
[data-region="kinki"]    .prefecture{fill:#2fa8c0!important;stroke:#2fa8c0!important;stroke-width:1!important;}
[data-region="chugoku"]  .prefecture{fill:#52bec8!important;stroke:#52bec8!important;stroke-width:1!important;}
[data-region="shikoku"]  .prefecture{fill:#3db8b8!important;stroke:#3db8b8!important;stroke-width:1!important;}
[data-region="kyushu"]   .prefecture{fill:#48c0c8!important;stroke:#48c0c8!important;stroke-width:1!important;}
[data-region="okinawa"]  .prefecture{fill:#5accc4!important;stroke:#5accc4!important;stroke-width:1!important;}

g[data-region]{cursor:pointer;-webkit-tap-highlight-color:transparent;}
.prefecture{transition:fill 0.08s ease;will-change:fill,stroke;}
g[data-region]:hover .prefecture{fill:#f4a0b0!important;stroke:#f4a0b0!important;}
g[data-region].active .prefecture{fill:#f4a0b0!important;stroke:#f4a0b0!important;}

.region-label{font-size:26px;font-weight:bold;fill:#fff;pointer-events:none;text-shadow:0 1px 4px rgba(0,60,80,.6);font-family:'Hiragino Sans','Noto Sans CJK SC',sans-serif;will-change:transform;}

#city-panel{width:100%;max-width:500px;background:#fff;border-radius:0 0 16px 16px;margin-top:-4px;padding:14px 16px 18px;box-shadow:0 6px 20px rgba(0,0,0,.09);display:none;}
#city-panel h3{font-size:15px;color:#2a8a9a;margin-bottom:10px;font-weight:600;}
#city-list{display:flex;flex-wrap:wrap;gap:8px;}
.city-btn{padding:6px 14px;border-radius:20px;background:#e2f5f8;color:#1a7a8a;font-size:13px;border:1px solid #aadde5;cursor:pointer;text-decoration:none;display:inline-block;transition:background .15s;}
.city-btn:hover{background:#3aafc4;color:#fff;border-color:#3aafc4;}

#footer{margin-top:16px;font-size:11px;color:#bbb;cursor:default;user-select:none;}

#pwd-overlay, #admin-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;justify-content:center;align-items:center;}
.overlay.show{display:flex!important;}
#pwd-box, #admin-box{background:#fff;border-radius:12px;padding:24px;width:300px;text-align:center;box-shadow:0 6px 30px rgba(0,0,0,.2);}
#admin-box{width:90%;max-width:500px;max-height:85vh;overflow-y:auto;text-align:left;}
#pwd-input{width:100%;border:1px solid #9dd;border-radius:8px;padding:8px;font-size:15px;text-align:center;margin-bottom:10px;outline:none;}
#pwd-submit, #admin-save{width:100%;background:#3aafc4;color:#fff;border:none;border-radius:8px;padding:8px;cursor:pointer;}
#admin-content{margin:15px 0;}
.admin-region{margin-bottom:15px;}
.admin-city-row{display:flex;align-items:center;gap:5px;margin-bottom:5px;font-size:12px;}
.admin-city-row input[type=text]{flex:1;border:1px solid #9dd;padding:3px 6px;border-radius:4px;}
</style></head>

const LABEL_POS = {"hokkaido":[730,168],"tohoku":[635,484],"kanto":[590,630],"chubu":[486,650],"kinki":[376,715],"chugoku":[248,720],"shikoku":[270,785],"kyushu":[140,834],"okinawa":[145,220]};
const TIP_TEXT = {"zh":"点击地图导航，快速前往目的地","zh-tw":"點擊地圖導航，快速前往目的地","ja":"地図をクリックして目的地へ","en":"Click on the map to navigate","ko":"지도를 클릭하여 길을 찾으세요","th":"คลิกที่แผนที่เพื่อนำทาง","vi":"Bấm vào bản đồ để điều hướng"};
const REGIONS = Object.keys(REGION_NAMES);
const ADMIN_PWD = 'Gaibian0821ll';

function browserLang(){
  const l=(navigator.language||'en').toLowerCase();
  if(l.startsWith('zh-tw')||l.startsWith('zh-hk'))return 'zh-tw';
  if(l.startsWith('zh'))return 'zh';
  if(l.startsWith('ja'))return 'ja';
  if(l.startsWith('ko'))return 'ko';
  if(l.startsWith('th'))return 'th';
  if(l.startsWith('vi'))return 'vi';
  return 'en';
}
let currentLang = browserLang();

const COUNTRY_LANG = { CN:'zh', TW:'zh-tw', HK:'zh-tw', MO:'zh-tw', JP:'ja', KR:'ko', TH:'th', VN:'vi' };
fetch('https://ipapi.co/json/').then(r=>r.json()).then(d=>{
  const ipL = COUNTRY_LANG[d.country_code];
  if(ipL && ipL !== currentLang){ currentLang = ipL; applyLang(); }
}).catch(()=>{});

function applyLang(){
  document.getElementById('lang-select').value = currentLang;
  document.getElementById('tip-text').textContent = TIP_TEXT[currentLang] || TIP_TEXT.en;
  updateLabels();
  if(selectedRegion) showCities(selectedRegion);
}

document.getElementById('lang-select').addEventListener('change', e=>{
  currentLang = e.target.value;
  applyLang();
});

function getCities(){ try{return JSON.parse(localStorage.getItem('jp_cities'))||DEFAULT_CITIES;}catch{return DEFAULT_CITIES;}}
function saveCities(d){ localStorage.setItem('jp_cities',JSON.stringify(d));}

const prefGs = document.querySelectorAll('g.prefecture');
const groups = {};
REGIONS.forEach(r=>groups[r]=[]);
prefGs.forEach(g=>{
  const cls=Array.from(g.classList);
  const region=REGIONS.find(r=>cls.includes(r));
  if(region) groups[region].push(g);
});

let selectedRegion=null;
const svg = document.querySelector('svg.geolonia-svg-map');
// 精简渲染逻辑：不再克隆路径，直接使用主路径描边提升 50% 性能
REGIONS.forEach(region=>{
  const ns=groups[region]; if(!ns.length)return;
  const w=document.createElementNS('http://www.w3.org/2000/svg','g');
  w.setAttribute('data-region',region);
  ns[0].parentNode.insertBefore(w,ns[0]);
  ns.forEach(n=>w.appendChild(n));
  w.addEventListener('click',()=>selectRegion(region));
});

const labelGroup = document.createElementNS('http://www.w3.org/2000/svg','g');
svg.appendChild(labelGroup);
function updateLabels(){
  labelGroup.innerHTML='';
  REGIONS.forEach(region=>{
    const p=LABEL_POS[region]; if(!p)return;
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',p[0]); t.setAttribute('y',p[1]);
    t.setAttribute('text-anchor','middle'); t.setAttribute('dominant-baseline','middle');
    t.setAttribute('class','region-label');
    t.textContent=REGION_NAMES[region][currentLang]||REGION_NAMES[region].en;
    labelGroup.appendChild(t);
  });
}

function selectRegion(r){
  selectedRegion=r;
  document.querySelectorAll('g[data-region]').forEach(g=>g.classList.remove('active'));
  document.querySelector('g[data-region="'+r+'"]').classList.add('active');
  showCities(r);
}

function showCities(r){
  const panel=document.getElementById('city-panel'), list=document.getElementById('city-list'), title=document.getElementById('city-panel-title');
  const cities=getCities(), rc=(cities[r]||[]).filter(c=>c.visible!==false);
  title.textContent=REGION_NAMES[r][currentLang]||r;
  list.innerHTML='';
  if(!rc.length) list.innerHTML='<span style="color:#aaa;font-size:13px;">No data</span>';
  else rc.forEach(c=>{
    const name=typeof c.name==='object'?(c.name[currentLang]||c.name.en):c.name;
    const el=c.url?Object.assign(document.createElement('a'),{href:c.url,target:'_blank',className:'city-btn'}):Object.assign(document.createElement('span'),{className:'city-btn'});
    el.textContent=name; list.appendChild(el);
  });
  panel.style.display='block';
}

// 底部文字快速点击5下触发
let cc=0,ct;
document.getElementById('footer').addEventListener('click',()=>{
  cc++; clearTimeout(ct); ct=setTimeout(()=>cc=0,2000);
  if(cc>=5){ cc=0; document.getElementById('pwd-overlay').classList.add('show'); }
});
document.getElementById('pwd-submit').addEventListener('click',()=>{
  if(document.getElementById('pwd-input').value===ADMIN_PWD){
    document.getElementById('pwd-overlay').classList.remove('show');
    showAdmin();
  } else alert('密码错误，请重试');
});

function showAdmin(){
  document.getElementById('admin-overlay').classList.add('show');
  const content=document.getElementById('admin-content'), cities=getCities();
  content.innerHTML='';
  REGIONS.forEach(r=>{
    const d=document.createElement('div'); d.className='admin-region';
    d.innerHTML='<h4 style="color:#3a9ab0;border-bottom:1px solid #ddd;margin-bottom:5px;">'+REGION_NAMES[r].zh+'</h4>';
    (cities[r]||[]).forEach((c,i)=>{
      const row=document.createElement('div'); row.className='admin-city-row';
      row.innerHTML='<input type="checkbox"'+(c.visible!==false?' checked':'')+' data-r="'+r+'" data-i="'+i+'" data-f="v">'+
        '<span style="width:70px;overflow:hidden;">'+(c.name.zh||c.name)+'</span>'+
        '<input type="text" value="'+(c.url||'')+'" data-r="'+r+'" data-i="'+i+'" data-f="u">';
      d.appendChild(row);
    });
    content.appendChild(d);
  });
}
document.getElementById('admin-save').addEventListener('click',()=>{
  const cities=getCities();
  document.querySelectorAll('input[data-f="v"]').forEach(cb=>{ cities[cb.dataset.r][cb.dataset.i].visible=cb.checked; });
  document.querySelectorAll('input[data-f="u"]').forEach(inp=>{ cities[inp.dataset.r][inp.dataset.i].url=inp.value.trim(); });
  saveCities(cities); document.getElementById('admin-overlay').classList.remove('show'); if(selectedRegion)showCities(selectedRegion);
});

applyLang();
</script>
